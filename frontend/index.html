<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTA2 知识问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .chat-container {
            height: 650px;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: left;
            line-height: 1.5;
            font-size: 14px;
        }

        /* Markdown 样式 - 紧凑版 */
        .message-content h1, .message-content h2, .message-content h3 {
            margin-top: 10px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #667eea;
            line-height: 1.3;
        }

        .message-content h1 { font-size: 1.3em; }
        .message-content h2 { font-size: 1.15em; }
        .message-content h3 { font-size: 1.05em; }

        .message-content h1:first-child,
        .message-content h2:first-child,
        .message-content h3:first-child {
            margin-top: 0;
        }

        .message-content p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .message-content ul, .message-content ol {
            margin-left: 18px;
            margin-bottom: 8px;
            padding-left: 0;
        }

        .message-content li {
            margin-bottom: 3px;
            line-height: 1.5;
        }

        .message-content ul ul,
        .message-content ol ol,
        .message-content ul ol,
        .message-content ol ul {
            margin-top: 3px;
            margin-bottom: 3px;
        }

        .message-content strong {
            color: #667eea;
            font-weight: 600;
        }

        .message-content code {
            background: #f5f5f5;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #e83e8c;
        }

        .message-content pre {
            background: #f5f5f5;
            padding: 8px 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: #333;
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 0.9em;
        }

        .message-content table th,
        .message-content table td {
            border: 1px solid #e0e0e0;
            padding: 6px 10px;
            text-align: left;
            line-height: 1.4;
        }

        .message-content table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        .message-content table tr:hover {
            background: #f8f9fa;
        }

        .message-content blockquote {
            border-left: 3px solid #667eea;
            padding-left: 12px;
            margin: 8px 0;
            color: #666;
            font-style: italic;
        }

        .message-content hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 10px 0;
        }

        /* 特殊符号美化 */
        .check-mark {
            color: #28a745;
            font-weight: bold;
        }

        .cross-mark {
            color: #dc3545;
            font-weight: bold;
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #questionInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #questionInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        .example-questions {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .example-questions h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .example-btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 DOTA2 知识问答</h1>
            <p>基于 RAG 的智能问答系统</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    你好！我是 DOTA2 知识助手。你可以问我关于 DOTA2 的任何问题，比如英雄技能、游戏机制、补丁更新等。
                </div>
            </div>
        </div>

        <!-- <div class="example-questions" >
            <h3>💡 试试这些问题：</h3>
            <button class="example-btn" onclick="askQuestion('幻影刺客有哪些技能？')">幻影刺客有哪些技能？</button>
            <button class="example-btn" onclick="askQuestion('最新补丁有什么改动？')">最新补丁有什么改动？</button>
            <button class="example-btn" onclick="askQuestion('如何出装影魔？')">如何出装影魔？</button>
        </div> -->

        <div class="loading" id="loading">正在思考中</div>

        <div class="input-container">
            <input
                type="text"
                id="questionInput"
                placeholder="输入你的问题..."
                onkeypress="handleKeyPress(event)"
            />
            <button id="sendButton" onclick="sendQuestion()">发送</button>
        </div>
    </div>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api/ask';

        // 配置 marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        function formatContent(content) {
            // 替换特殊符号
            content = content.replace(/✅/g, '<span class="check-mark">✅</span>');
            content = content.replace(/❌/g, '<span class="cross-mark">❌</span>');

            // 处理表格分隔符（如果markdown格式不标准）
            content = content.replace(/\|-+\|/g, (match) => {
                return '\n' + match + '\n';
            });

            return content;
        }

        function addMessage(content, isUser) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (isUser) {
                contentDiv.textContent = content;
            } else {
                // 格式化和渲染 Markdown
                const formattedContent = formatContent(content);
                contentDiv.innerHTML = marked.parse(formattedContent);
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setLoading(isLoading) {
            document.getElementById('loading').classList.toggle('active', isLoading);
            document.getElementById('sendButton').disabled = isLoading;
            document.getElementById('questionInput').disabled = isLoading;
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();

            if (!question) return;

            addMessage(question, true);
            input.value = '';
            setLoading(true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessage(data.answer, false);
            } catch (error) {
                console.error('Error:', error);
                addMessage('抱歉，发生了错误。请确保后端服务正在运行。', false);
            } finally {
                setLoading(false);
            }
        }

        function askQuestion(question) {
            document.getElementById('questionInput').value = question;
            sendQuestion();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendQuestion();
            }
        }
    </script>
</body>
</html>
